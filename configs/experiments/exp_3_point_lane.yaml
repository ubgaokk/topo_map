# Experiment 3: Add Point-Lane Graph (without endpoint detection)
# Tests the impact of point-lane hierarchical graph alone

model:
  dim: 256
  num_lane_queries: 200
  num_te_queries: 100
  num_points: 32
  bev_h: 100
  bev_w: 200
  num_decoder_layers: 6
  num_heads: 8
  
  use_endpoint_detector: false  # Disabled for ablation
  use_point_lane_graph: true
  gnn_layers: 3
  adjacency_threshold: 5.0

training:
  batch_size: 4
  lr: 2.0e-4
  epochs: 30
  lambda_detection: 1.0
  lambda_topology: 1.0
  lambda_endpoint: 0.0

data:
  data_root: /path/to/openlane_v2/subset_A
  num_workers: 4

logging:
  project_name: topo_map
  experiment_name: exp_3_point_lane